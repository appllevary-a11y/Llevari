<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Llevari Web</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MapLibre GL CSS & JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 pb-24">

  <!-- Header / Navbar -->
  <header class="bg-red-600 text-white p-4 shadow-md sticky top-0 z-30 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold tracking-wide">LLEVARI</h1>
      <p class="text-xs text-red-100" id="user-location-text">Obteniendo ubicación...</p>
    </div>
    <button id="btn-ver-carrito" onclick="toggleCarrito()" class="relative bg-white text-red-600 px-4 py-2 rounded-full font-bold text-sm shadow">
      🛒 Carrito (<span id="cart-count">0</span>)
    </button>
  </header>

  <!-- VISTA PRINCIPAL: Lista de Restaurantes -->
  <main id="vista-restaurantes" class="max-w-4xl mx-auto p-4">
    <h2 class="text-xl font-bold mb-4 text-gray-700">Restaurantes Disponibles</h2>
    <div id="grid-restaurantes" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <p class="text-gray-500">Cargando locales cercanos...</p>
    </div>
  </main>

  <!-- VISTA MENU / PRODUCTOS (Modal Full) -->
  <div id="modal-menu" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-40 flex justify-end">
    <div class="bg-white w-full max-w-lg h-full overflow-y-auto p-6 shadow-2xl relative flex flex-col">
      <button onclick="cerrarMenu()" class="absolute top-4 right-4 bg-gray-200 text-gray-800 rounded-full w-8 h-8 font-bold">✕</button>
      <h2 id="menu-restaurante-nombre" class="text-2xl font-bold text-red-600 mb-1"></h2>
      <p id="menu-restaurante-distancia" class="text-sm text-gray-500 mb-4"></p>
      
      <div id="lista-productos" class="flex-1 space-y-4 overflow-y-auto"></div>
    </div>
  </div>

  <!-- VISTA CARRITO & CHECKOUT (Modal Drawer) -->
  <div id="modal-carrito" class="hidden fixed inset-0 bg-black/50 z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4 border-b pb-2">
        <h2 class="text-xl font-bold text-gray-800">Tu Pedido</h2>
        <button onclick="toggleCarrito()" class="text-gray-500 text-xl font-bold">✕</button>
      </div>

      <div id="items-carrito" class="flex-1 overflow-y-auto space-y-3 divide-y">
        <p class="text-gray-400 text-center mt-10">El carrito está vacío</p>
      </div>

      <!-- Modalidad Delivery vs Pickup -->
      <div class="mt-4 pt-4 border-t space-y-2">
        <label class="block text-sm font-semibold text-gray-700">Modalidad de entrega:</label>
        <div class="flex gap-2">
          <button id="btn-delivery" onclick="setModalidad('DELIVERY')" class="flex-1 py-2 rounded-lg font-bold border-2 border-red-600 bg-red-600 text-white text-sm">Delivery</button>
          <button id="btn-pickup" onclick="setModalidad('PICKUP')" class="flex-1 py-2 rounded-lg font-bold border-2 border-gray-300 text-gray-600 text-sm">Pickup (Llevar)</button>
        </div>
      </div>

      <!-- Desglose de Totales -->
      <div class="border-t pt-4 mt-4 space-y-1 text-sm">
        <div class="flex justify-between text-gray-600">
          <span>Subtotal:</span>
          <span>L. <span id="cart-subtotal">0.00</span></span>
        </div>
        <div class="flex justify-between text-gray-600" id="row-envio">
          <span>Costo de envío:</span>
          <span>L. <span id="cart-envio">0.00</span></span>
        </div>
        <div class="flex justify-between font-bold text-lg text-gray-900 border-t pt-2">
          <span>Total:</span>
          <span>L. <span id="cart-total">0.00</span></span>
        </div>
      </div>

      <button id="btn-confirmar-pedido" onclick="enviarPedidoFirestore()" disabled class="mt-4 w-full bg-red-600 disabled:bg-gray-300 text-white font-bold py-3 rounded-xl text-lg shadow-lg">
        Confirmar Pedido
      </button>
    </div>
  </div>

  <!-- VISTA SEGUIMIENTO EN TIEMPO REAL -->
  <div id="vista-seguimiento" class="hidden fixed inset-0 bg-white z-50 flex flex-col">
    <div class="bg-red-600 text-white p-4 flex justify-between items-center shadow-md">
      <div>
        <h3 class="font-bold text-lg">Seguimiento de Pedido</h3>
        <p id="tracking-estado" class="text-sm bg-red-800 px-2 py-0.5 rounded-full inline-block mt-1">ESTADO: NUEVO</p>
      </div>
      <button onclick="cerrarSeguimiento()" class="bg-white text-red-600 px-3 py-1 rounded-lg font-bold text-sm">Volver</button>
    </div>

    <!-- Contenedor del Mapa MapLibre -->
    <div id="mapa-seguimiento" class="flex-1 w-full bg-gray-200"></div>

    <div class="p-4 bg-white shadow-top border-t flex justify-between items-center">
      <div>
        <p class="text-xs text-gray-500">ID Pedido</p>
        <p id="tracking-id" class="font-mono text-sm font-bold text-gray-800">-</p>
      </div>
      <div id="badge-chat" class="bg-blue-100 text-blue-800 font-bold px-3 py-1 rounded-full text-xs hidden">
        💬 Mensajes nuevos
      </div>
    </div>
  </div>

  <!-- LOGICA DE FIREBASE Y APLICACION -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, query, where, getDocs, getDoc, doc, addDoc, onSnapshot, GeoPoint, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. CONFIGURACION FIREBASE (Reemplazar con credenciales de tu consola)
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "tu-proyecto.firebaseapp.com",
      projectId: "tu-proyecto",
      storageBucket: "tu-proyecto.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Estado global
    let clienteUbi = { lat: 13.3025, lng: -87.1941 }; // Ubicación por defecto (Choluteca)
    let carrito = [];
    let restauranteSeleccionado = null;
    let modalidadActual = 'DELIVERY';
    let costoEnvioCalculado = 0;
    let listenerPedidoUnsubscribe = null;
    let mapInstance = null;
    let markerCliente = null;
    let markerRepartidor = null;

    // Inicialización del cliente
    window.addEventListener('DOMContentLoaded', () => {
      obtenerUbicacionNavegador();
    });

    function obtenerUbicacionNavegador() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            clienteUbi = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            document.getElementById('user-location-text').textContent = `Ubicación: ${clienteUbi.lat.toFixed(4)}, ${clienteUbi.lng.toFixed(4)}`;
            cargarRestaurantes();
          },
          () => {
            document.getElementById('user-location-text').textContent = "Ubicación por defecto (Choluteca)";
            cargarRestaurantes();
          }
        );
      } else {
        cargarRestaurantes();
      }
    }

    // 2. CÁLCULO DE DISTANCIAS Y TARIFAS (OSRM + HAVERSINE)
    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    async function obtenerDistanciaOSRM(lat1, lon1, lat2, lon2) {
      try {
        const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=false`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        if (data.routes?.[0]) return data.routes[0].distance / 1000;
      } catch (e) {
        console.warn("OSRM no disponible, usando línea recta.");
      }
      return haversineKm(lat1, lon1, lat2, lon2);
    }

    async function calcularTarifaEnvio(restLat, restLng) {
      let pagoKm = 15;
      let envioMax = 150;

      try {
        const snap = await getDoc(doc(db, "configuracion", "tarifas"));
        if (snap.exists()) {
          pagoKm = snap.data().pago_km ?? pagoKm;
          envioMax = snap.data().envio_visible_max ?? envioMax;
        }
      } catch (e) {
        console.error("Error al leer tarifas Firestore", e);
      }

      const dist = await obtenerDistanciaOSRM(clienteUbi.lat, clienteUbi.lng, restLat, restLng);
      const costo = Math.min(Math.max(pagoKm, dist * pagoKm), envioMax);
      
      return { distKm: dist.toFixed(2), costoEnvio: Number(costo.toFixed(2)) };
    }

    // 3. CONSULTA DE RESTAURANTES (FILTRO ABIERTOS Y PROXIMIDAD)
    async function cargarRestaurantes() {
      const container = document.getElementById('grid-restaurantes');
      try {
        const q = query(collection(db, "restaurantes"), where("estado", "==", "abierto"));
        const snapshot = await getDocs(q);
        
        if (snapshot.empty) {
          container.innerHTML = `<p class="text-gray-500 col-span-2">No hay restaurantes abiertos por el momento.</p>`;
          return;
        }

        const lista = [];
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const rLat = data.ubicacion?.latitude ?? data.latitud;
          const rLng = data.ubicacion?.longitude ?? data.longitud;
          const dist = (rLat && rLng) ? haversineKm(clienteUbi.lat, clienteUbi.lng, rLat, rLng) : 999;
          
          lista.push({ id: docSnap.id, ...data, rLat, rLng, distCalculada: dist });
        });

        // Ordenar por proximidad
        lista.sort((a, b) => a.distCalculada - b.distCalculada);

        container.innerHTML = lista.map(r => `
          <div onclick='abrirMenuRestaurante(${JSON.stringify(r)})' class="bg-white p-4 rounded-xl shadow hover:shadow-lg cursor-pointer transition flex items-center justify-between border">
            <div>
              <h3 class="font-bold text-lg text-gray-800">${r.nombre}</h3>
              <p class="text-xs text-gray-500">${r.categoria || 'Restaurante'}</p>
              <p class="text-xs text-red-600 font-semibold mt-1">📍 A ${r.distCalculada.toFixed(1)} km aproximadamente</p>
            </div>
            <span class="bg-red-50 text-red-600 p-2 rounded-full font-bold text-xl">➔</span>
          </div>
        `).join('');

      } catch (e) {
        console.error(e);
        container.innerHTML = `<p class="text-red-500">Error al cargar restaurantes. Verifica tu conexión y configuración de Firebase.</p>`;
      }
    }

    // 4. MENU Y PRODUCTOS
    window.abrirMenuRestaurante = async (rest) => {
      restauranteSeleccionado = rest;
      
      // Calcular tarifa de envío exacta con OSRM al abrir el local
      const tarifa = await calcularTarifaEnvio(rest.rLat, rest.rLng);
      costoEnvioCalculado = tarifa.costoEnvio;

      document.getElementById('menu-restaurante-nombre').textContent = rest.nombre;
      document.getElementById('menu-restaurante-distancia').textContent = `Distancia: ${tarifa.distKm} km | Envío: L. ${tarifa.costoEnvio}`;

      const container = document.getElementById('lista-productos');
      const menuItems = rest.menu || rest.productos || [];

      if (menuItems.length === 0) {
        container.innerHTML = `<p class="text-gray-400">Este restaurante aún no tiene menú configurado.</p>`;
      } else {
        container.innerHTML = menuItems.map((prod, index) => `
          <div class="flex justify-between items-center border-b pb-3">
            <div>
              <h4 class="font-bold text-gray-800">${prod.nombre}</h4>
              <p class="text-xs text-gray-500">${prod.descripcion || ''}</p>
              <p class="font-bold text-red-600 mt-1">L. ${Number(prod.precio).toFixed(2)}</p>
            </div>
            <button onclick='agregarAlCarrito(${JSON.stringify(prod)})' class="bg-red-600 text-white font-bold px-3 py-1 rounded-lg text-sm shadow">
              + Agregar
            </button>
          </div>
        `).join('');
      }

      document.getElementById('modal-menu').classList.remove('hidden');
    };

    window.cerrarMenu = () => {
      document.getElementById('modal-menu').classList.add('hidden');
    };

    // 5. CARRITO DE COMPRAS
    window.agregarAlCarrito = (producto) => {
      const idx = carrito.findIndex(i => i.nombre === producto.nombre);
      if (idx > -1) {
        carrito[idx].cantidad += 1;
      } else {
        carrito.push({ ...producto, cantidad: 1 });
      }
      actualizarCarritoUI();
    };

    function actualizarCarritoUI() {
      const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
      document.getElementById('cart-count').textContent = totalItems;

      const itemsContainer = document.getElementById('items-carrito');
      
      if (carrito.length === 0) {
        itemsContainer.innerHTML = `<p class="text-gray-400 text-center mt-10">El carrito está vacío</p>`;
        document.getElementById('cart-subtotal').textContent = "0.00";
        document.getElementById('cart-envio').textContent = "0.00";
        document.getElementById('cart-total').textContent = "0.00";
        document.getElementById('btn-confirmar-pedido').disabled = true;
        return;
      }

      let subtotal = 0;
      itemsContainer.innerHTML = carrito.map((item, idx) => {
        const itemSubtotal = item.precio * item.cantidad;
        subtotal += itemSubtotal;
        return `
          <div class="flex justify-between items-center pt-2">
            <div>
              <p class="font-bold text-sm text-gray-800">${item.nombre}</p>
              <p class="text-xs text-gray-500">L. ${item.precio} x ${item.cantidad}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="cambiarCantidad(${idx}, -1)" class="bg-gray-200 px-2 py-0.5 rounded font-bold">-</button>
              <span class="font-bold text-sm">${item.cantidad}</span>
              <button onclick="cambiarCantidad(${idx}, 1)" class="bg-gray-200 px-2 py-0.5 rounded font-bold">+</button>
            </div>
          </div>
        `;
      }).join('');

      const envioFinal = modalidadActual === 'DELIVERY' ? costoEnvioCalculado : 0;
      const total = subtotal + envioFinal;

      document.getElementById('cart-subtotal').textContent = subtotal.toFixed(2);
      document.getElementById('cart-envio').textContent = envioFinal.toFixed(2);
      document.getElementById('cart-total').textContent = total.toFixed(2);
      document.getElementById('btn-confirmar-pedido').disabled = false;
    }

    window.cambiarCantidad = (index, delta) => {
      carrito[index].cantidad += delta;
      if (carrito[index].cantidad <= 0) {
        carrito.splice(index, 1);
      }
      actualizarCarritoUI();
    };

    window.toggleCarrito = () => {
      const el = document.getElementById('modal-carrito');
      el.classList.toggle('hidden');
    };

    window.setModalidad = (mod) => {
      modalidadActual = mod;
      const btnDel = document.getElementById('btn-delivery');
      const btnPick = document.getElementById('btn-pickup');
      const rowEnvio = document.getElementById('row-envio');

      if (mod === 'DELIVERY') {
        btnDel.className = "flex-1 py-2 rounded-lg font-bold border-2 border-red-600 bg-red-600 text-white text-sm";
        btnPick.className = "flex-1 py-2 rounded-lg font-bold border-2 border-gray-300 text-gray-600 text-sm";
        rowEnvio.classList.remove('hidden');
      } else {
        btnPick.className = "flex-1 py-2 rounded-lg font-bold border-2 border-red-600 bg-red-600 text-white text-sm";
        btnDel.className = "flex-1 py-2 rounded-lg font-bold border-2 border-gray-300 text-gray-600 text-sm";
        rowEnvio.classList.add('hidden');
      }
      actualizarCarritoUI();
    };

    // 6. GUARDAR PEDIDO Y VISTA TIEMPO REAL
    window.enviarPedidoFirestore = async () => {
      if (!restauranteSeleccionado || carrito.length === 0) return;

      const btn = document.getElementById('btn-confirmar-pedido');
      btn.disabled = true;
      btn.textContent = "Procesando...";

      const subtotal = carrito.reduce((sum, i) => sum + (i.precio * i.cantidad), 0);
      const envio = modalidadActual === 'DELIVERY' ? costoEnvioCalculado : 0;

      try {
        const payload = {
          cliente_id: "usr_web_client",
          restaurante_id: restauranteSeleccionado.id,
          restaurante_nombre: restauranteSeleccionado.nombre,
          productos: carrito,
          subtotal: subtotal,
          costo_envio: envio,
          total: subtotal + envio,
          modalidad: modalidadActual,
          estado: "NUEVO",
          ubicacion_cliente: new GeoPoint(clienteUbi.lat, clienteUbi.lng),
          ubicacion_repartidor: null,
          repartidor_id: null,
          mensajes_no_leidos: 0,
          fecha_creacion: serverTimestamp()
        };

        const docRef = await addDoc(collection(db, "pedidos"), payload);

        // Limpiar
        carrito = [];
        actualizarCarritoUI();
        toggleCarrito();
        cerrarMenu();

        // Iniciar pantalla de seguimiento en vivo
        iniciarSeguimientoPedido(docRef.id);

      } catch (e) {
        console.error("Error al crear pedido en Firestore:", e);
        alert("Ocurrió un error al enviar el pedido.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Confirmar Pedido";
      }
    };

    // 7. SEGUIMIENTO CON MAPLIBRE Y FIRESTORE LISTENER
    function iniciarSeguimientoPedido(pedidoId) {
      document.getElementById('vista-seguimiento').classList.remove('hidden');
      document.getElementById('tracking-id').textContent = pedidoId;

      // Iniciar mapa MapLibre GL
      if (!mapInstance) {
        mapInstance = new maplibregl.Map({
          container: 'mapa-seguimiento',
          style: 'https://demotiles.maplibre.org/style.json',
          center: [clienteUbi.lng, clienteUbi.lat],
          zoom: 14
        });

        markerCliente = new maplibregl.Marker({ color: "#DC2626" })
          .setLngLat([clienteUbi.lng, clienteUbi.lat])
          .setPopup(new maplibregl.Popup().setText("Tu Ubicación"))
          .addTo(mapInstance);
      } else {
        mapInstance.setCenter([clienteUbi.lng, clienteUbi.lat]);
      }

      // Escuchar cambios en Firestore
      const pedidoRef = doc(db, "pedidos", pedidoId);
      listenerPedidoUnsubscribe = onSnapshot(pedidoRef, (snap) => {
        if (!snap.exists()) return;

        const data = snap.data();

        // Actualizar etiqueta de estado
        document.getElementById('tracking-estado').textContent = `ESTADO: ${data.estado || 'NUEVO'}`;

        // Ubicación en tiempo real del repartidor
        if (data.ubicacion_repartidor) {
          const repLng = data.ubicacion_repartidor.longitude;
          const repLat = data.ubicacion_repartidor.latitude;

          if (!markerRepartidor) {
            markerRepartidor = new maplibregl.Marker({ color: "#2563EB" })
              .setLngLat([repLng, repLat])
              .setPopup(new maplibregl.Popup().setText("Repartidor"))
              .addTo(mapInstance);
          } else {
            markerRepartidor.setLngLat([repLng, repLat]);
          }

          // Ajustar zoom para ver ambos puntos
          const bounds = new maplibregl.LngLatBounds()
            .extend([clienteUbi.lng, clienteUbi.lat])
            .extend([repLng, repLat]);
          mapInstance.fitBounds(bounds, { padding: 80 });
        }

        // Indicador de mensajes
        const badgeChat = document.getElementById('badge-chat');
        if (data.mensajes_no_leidos > 0) {
          badgeChat.classList.remove('hidden');
        } else {
          badgeChat.classList.add('hidden');
        }
      });
    }

    window.cerrarSeguimiento = () => {
      if (listenerPedidoUnsubscribe) {
        listenerPedidoUnsubscribe();
        listenerPedidoUnsubscribe = null;
      }
      document.getElementById('vista-seguimiento').classList.add('hidden');
    };
  </script>
</body>
</html>
